name: Sentiment UI Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - patch_sentiment_tab.py
      - patch_sentiment_series_filter.py
      - patch_sentiment_panzoom.py
      - patch_sentiment_index_return.py
      - patch_sentiment_divergence_panzoom.py
      - patch_sentiment_performance.py
      - patch_sentiment_syntax_repair.py
      - docs/sentiment.html
      - .github/workflows/sentiment_ui_deploy.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sentiment-ui-deploy
  cancel-in-progress: true

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch sentiment UI
        run: |
          python3 patch_sentiment_tab.py
          python3 patch_sentiment_series_filter.py
          python3 patch_sentiment_panzoom.py
          python3 patch_sentiment_index_return.py
          python3 patch_sentiment_divergence_panzoom.py
          python3 patch_sentiment_performance.py
          python3 patch_sentiment_syntax_repair.py

      - name: Validate sentiment JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('docs/sentiment.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not blocks:
              raise SystemExit('no inline script found')
          Path('/tmp/sentiment.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/sentiment.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
