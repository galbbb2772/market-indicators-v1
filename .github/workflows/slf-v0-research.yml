name: SLF V0 Research Scan

on:
  pull_request:
    branches:
      - research/market-top-unified-ledger-2026-10-19
    paths:
      - 'research/master_top_v3_slf_v0/**'
      - '.github/workflows/slf-v0-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-slf-v0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests tabulate lxml html5lib beautifulsoup4
      - name: Probe retained OFR mirror API
        run: |
          python - <<'PY'
          import requests
          u='https://economicriskclock.org/api/v1/data/metric_history'
          r=requests.get(u,params={'entity_id':'us_ofr_funding_contribution','limit':5},timeout=30)
          print('status=',r.status_code)
          print(r.text[:5000])
          PY
      - name: Probe NY Fed Primary Dealer API schema
        run: |
          python - <<'PY'
          import requests
          u='https://markets.newyorkfed.org/static/docs/markets-api.yml'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0 MarketRegimeLab/SLF-V0'},timeout=30)
          print('status=',r.status_code,'bytes=',len(r.content))
          r.raise_for_status()
          lines=r.text.splitlines()
          for i,line in enumerate(lines):
              if '/pd/' in line or ('seriesbreak' in line.lower() and 'pd' in '\n'.join(lines[max(0,i-5):i+5]).lower()):
                  print('\n'.join(lines[max(0,i-8):min(len(lines),i+35)]))
                  print('---PD-SCHEMA-BLOCK---')
          PY
      - name: Run frozen SLF V0 scan
        run: python research/master_top_v3_slf_v0/slf_v0_research.py
      - name: Upload SLF V0 research outputs
        uses: actions/upload-artifact@v4
        with:
          name: slf-v0-research-output
          path: research/master_top_v3_slf_v0/output/
          if-no-files-found: error
