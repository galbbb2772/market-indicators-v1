name: Market Top NG3 CostPressure Screen

on:
  pull_request:
    paths:
      - "research/MARKET_TOP_NG3_COSTPRESSURE_PREREGISTRATION.md"
      - "research/market_top_ng3_costpressure_preregistration.json"
      - "screen_market_top_ng3_costpressure.py"
      - "tests/test_market_top_ng3_costpressure.py"
      - ".github/workflows/market_top_ng3_costpressure_screen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Verify frozen preregistration contract
        run: python -m unittest tests.test_market_top_ng3_costpressure -v

      - name: Run preregistered historical screen
        run: |
          python screen_market_top_ng3_costpressure.py \
            --output market_top_ng3_costpressure_screen.json

      - name: Print decision summary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("market_top_ng3_costpressure_screen.json"))
          print("coverage =", json.dumps(x["coverage"], indent=2))
          print("decision =", json.dumps(x["decision"], indent=2))
          for name, s in x["summaries"].items():
              print(name, json.dumps(s, indent=2))
          for ep in x["episodes"]["ng3_costpressure"]:
              print(
                  "NG3 episode",
                  ep["start"],
                  ep["end"],
                  ep["classification"],
                  ep["scores_at_start"]["costpressure_ng3"],
                  ep["horizons"]["h252"].get("worst_return_from_anchor_pct"),
              )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: market-top-ng3-costpressure-screen
          path: market_top_ng3_costpressure_screen.json
          if-no-files-found: error
