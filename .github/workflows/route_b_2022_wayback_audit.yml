name: Route_B 2022 Wayback Vintage Audit

on:
  pull_request:
    paths:
      - "audit_ff_wayback_202201.py"
      - "audit_ff_2022_archive.py"
      - "tests/test_audit_ff_wayback_202201.py"
      - ".github/workflows/route_b_2022_wayback_audit.yml"
  workflow_dispatch:

jobs:
  wayback-vintage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Static contract
        run: python -m unittest tests.test_audit_ff_wayback_202201 -v
      - name: Attempt pre-Jan-3-2022 Wayback factor ZIP recovery
        run: |
          python audit_ff_wayback_202201.py --output /tmp/ff_wayback_202201.json
          python - <<'PY'
          import json
          x = json.load(open("/tmp/ff_wayback_202201.json"))
          assert x["cutoff"] == "20220103235959"
          assert x["status"] == "NO_PRE_CUTOFF_SNAPSHOT_WITH_202111", (
              "Wayback coverage changed; refresh the committed vintage-gap "
              "evidence before accepting this PR."
          )
          assert x["exact_or_pre_cutoff_vintage"] is False
          assert x.get("errors") == [], (
              "A Wayback query failed, so archive coverage cannot be claimed complete."
          )
          attempts = x.get("attempts") or []
          assert attempts, "Wayback audit must inspect at least one archived candidate"
          for row in attempts:
              ts = row.get("timestamp")
              if ts:
                  assert ts <= x["cutoff"]
          assert not any(r.get("has_202111") for r in attempts)
          usable = [r for r in attempts if r.get("last_month")]
          assert usable, "No usable archived ZIP was parsed"
          latest_ts = max(str(r["timestamp"]) for r in usable)
          latest_variants = [
              r for r in usable if str(r["timestamp"]) == latest_ts
          ]
          latest_max_month = max(
              str(r["last_month"]) for r in latest_variants
          )
          assert latest_ts == "20210413020542"
          assert latest_max_month == "202102"
          assert x["latest_usable_capture_timestamp"] == latest_ts
          assert x["latest_usable_max_last_month"] == latest_max_month
          assert len(x["latest_usable_variants"]) == len(latest_variants)
          print(
              "WAYBACK_VINTAGE_AUDIT",
              "status=", x["status"],
              "candidates=", len(attempts),
          )
          PY
