name: Factor Map V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - research_factor_map_v1.py
      - research/factor_map_v1/STUDY_SPEC.md
      - ablation_runner.py
      - update_data.py
      - indicator_config.json
      - market_model_v2.json
      - requirements.txt
      - .github/workflows/factor_map_v1.yml

permissions:
  contents: write

concurrency:
  group: factor-map-v1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build Factor Map V1
        run: python research_factor_map_v1.py
      - name: Validate Factor Map V1
        run: |
          python - <<'PY'
          import json
          p='docs/data/factor_map_v1.json'
          s='docs/data/factor_map_v1_summary.json'
          d=json.load(open(p,encoding='utf-8'))
          q=json.load(open(s,encoding='utf-8'))
          assert d['schema']=='MARKET-FACTOR-MAP-V1'
          assert q['schema']=='MARKET-FACTOR-MAP-V1-SUMMARY'
          assert d['research_only'] is True and d['diagnostic_only'] is True
          assert d['production_effect']=='none'
          assert d['weights_changed'] is False and d['thresholds_changed'] is False
          assert d['guardrails']['may_change_production'] is False
          assert d['guardrails']['may_reweight_model'] is False
          assert d['guardrails']['may_remove_indicator'] is False
          assert d['coverage']['eligible_directional_indicator_count'] >= 50
          assert d['coverage']['family_count'] >= 8
          assert len(d['summary_rows']) == d['coverage']['family_count']
          for x in d['summary_rows']:
              assert 'ic10' in x and 'partial_ic10' in x
          print('FACTOR_MAP_V1_VALID', d['coverage'])
          PY
      - name: Commit research data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+galbbb2772@users.noreply.github.com'
          git add docs/data/factor_map_v1.json docs/data/factor_map_v1_summary.json
          if git diff --cached --quiet; then
            echo 'No Factor Map change.'
          else
            git commit -m 'data: refresh Factor Map V1'
            # update_data.py is instrumented during research and can refresh current.json.
            # Keep this workflow research-only by discarding every uncommitted side effect
            # after the Factor Map files themselves have been committed.
            git restore --worktree --staged .
            git pull --rebase origin main
            git push
          fi
