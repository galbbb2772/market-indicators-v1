name: MASTER TOP TradingView probe

on:
  push:
    branches: [master-top-v218-live-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tradingview-screener
      - name: Probe secretless US H/L universe
        run: |
          python - <<'PY'
          import pandas as pd
          from tradingview_screener import Query, col
          
          cols=['name','close','high','low','price_52_week_high','price_52_week_low',
                'exchange','type','typespecs','update_mode','is_primary']
          total,df=(Query().select(*cols).where(col('is_primary')==True).limit(30000).get_scanner_data())
          print('RAW_TOTAL',total,'ROWS',len(df))
          print('EXCHANGES',df['exchange'].value_counts().head(15).to_dict())
          print('TYPES',df['type'].value_counts(dropna=False).to_dict())
          
          def has_common(x):
              if isinstance(x,(list,tuple,set)): return 'common' in x
              return 'common' in str(x).lower()
          us=df[df['exchange'].isin(['NYSE','NASDAQ','AMEX'])].copy()
          common=us[(us['type'].eq('dr')) | (us['type'].eq('stock') & us['typespecs'].map(has_common))].copy()
          valid=common[['high','low','price_52_week_high','price_52_week_low']].notna().all(axis=1)
          common=common[valid]
          nh=(common['high'] >= common['price_52_week_high']*(1-1e-10))
          nl=(common['low'] <= common['price_52_week_low']*(1+1e-10))
          print('COMMON_ADR_UNIVERSE',len(common))
          print('COMMON_ADR_COUNTS',int(nh.sum()),int(nl.sum()),'NET',int(nh.sum()-nl.sum()))
          for ex,g in common.groupby('exchange'):
              h=(g['high']>=g['price_52_week_high']*(1-1e-10)).sum()
              l=(g['low']<=g['price_52_week_low']*(1+1e-10)).sum()
              print('EX',ex,'N',len(g),'H',int(h),'L',int(l),'NET',int(h-l))
          print('UPDATE_MODES',common['update_mode'].value_counts(dropna=False).to_dict())
          PY
