name: MASTER TOP TradingView probe

on:
  push:
    branches: [master-top-v218-live-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tradingview-screener
      - name: Probe NYSE cross-sectional H/L counts
        run: |
          python - <<'PY'
          from tradingview_screener import Query, col
          
          def qbase():
              return (
                  Query()
                  .select('name','close','high','low','price_52_week_high','price_52_week_low','exchange','type','typespecs','update_mode')
                  .where(col('exchange') == 'NYSE', col('is_primary') == True)
                  .limit(10000)
              )
          
          total,df=qbase().get_scanner_data()
          print('TOTAL',total,'ROWS',len(df))
          print('UPDATE_MODES')
          print(df['update_mode'].value_counts(dropna=False).to_string())
          
          nh_close=(df['close'] >= df['price_52_week_high'] * (1-1e-10)).sum()
          nl_close=(df['close'] <= df['price_52_week_low'] * (1+1e-10)).sum()
          nh_intra=(df['high'] >= df['price_52_week_high'] * (1-1e-10)).sum()
          nl_intra=(df['low'] <= df['price_52_week_low'] * (1+1e-10)).sum()
          print('CLIENT_CLOSE_COUNTS',int(nh_close),int(nl_close))
          print('CLIENT_INTRADAY_COUNTS',int(nh_intra),int(nl_intra))
          print('CLIENT_SAMPLE_HI')
          print(df.loc[df['high'] >= df['price_52_week_high']*(1-1e-10), ['ticker','high','close','price_52_week_high']].head(20).to_string(index=False))
          print('CLIENT_SAMPLE_LO')
          print(df.loc[df['low'] <= df['price_52_week_low']*(1+1e-10), ['ticker','low','close','price_52_week_low']].head(20).to_string(index=False))
          
          hi_count,_=(qbase().where(col('exchange')=='NYSE',col('is_primary')==True,col('high') >= col('price_52_week_high')).get_scanner_data())
          lo_count,_=(qbase().where(col('exchange')=='NYSE',col('is_primary')==True,col('low') <= col('price_52_week_low')).get_scanner_data())
          print('SERVER_INTRADAY_COUNTS',hi_count,lo_count)
          PY
