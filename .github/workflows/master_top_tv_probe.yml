name: MASTER TOP TradingView probe

on:
  push:
    branches: [master-top-v218-live-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client
      - name: Probe HIGN LOWN chart websocket
        run: |
          python - <<'PY'
          import json,re,time,websocket
          
          URI='wss://data.tradingview.com/socket.io/websocket?from=chart%2F&type=chart'
          def frame(m,p):
              raw=json.dumps({'m':m,'p':p},separators=(',',':'))
              return f'~m~{len(raw)}~m~{raw}'
          
          def probe(symbol):
              print('=== PROBE',symbol,'===')
              ws=websocket.create_connection(
                  URI,timeout=15,
                  origin='https://www.tradingview.com',
                  header=['User-Agent: Mozilla/5.0'],
                  suppress_origin=False,
              )
              first=ws.recv()
              print('HANDSHAKE',str(first)[:1000])
              m=re.search(r'"session_id":"([^"]+)"',str(first))
              sid='cs_'+(m.group(1) if m else 'v218probe')
              for method,params in [
                  ('chart_create_session',[sid]),
                  ('resolve_symbol',[sid,'s1',symbol]),
                  ('create_series',[sid,'sds_1','s1','s1','1D',30,'']),
              ]:
                  ws.send(frame(method,params))
              deadline=time.time()+20
              found=False
              while time.time()<deadline:
                  try: msg=ws.recv()
                  except Exception as e:
                      print('RECVERR',repr(e));break
                  s=str(msg)
                  for ping in re.findall(r'~h~\d+',s):
                      ws.send(f'~m~{len(ping)}~m~{ping}')
                  if 'symbol_error' in s or 'critical_error' in s or 'series_error' in s:
                      print('ERROR_FRAME',s[:5000])
                  if 'symbol_resolved' in s:
                      print('RESOLVED',s[:5000])
                  if 'timescale_update' in s:
                      print('TIMESCALE',s[:12000]);found=True;break
              print('FOUND',found)
              ws.close()
          
          for symbol in ['INDEX:HIGN','INDEX:LOWN','USI:HIGN','USI:LOWN']:
              try: probe(symbol)
              except Exception as e: print('PROBEFAIL',symbol,repr(e))
          PY
