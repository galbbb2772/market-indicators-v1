name: MASTER TOP TradingView probe

on:
  push:
    branches: [master-top-v218-live-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe HIGN LOWN
        run: |
          python - <<'PY'
          import json, requests
          url='https://scanner.tradingview.com/global/scan'
          headers={
            'User-Agent':'Mozilla/5.0',
            'Origin':'https://www.tradingview.com',
            'Referer':'https://www.tradingview.com/',
            'Content-Type':'application/json',
          }
          candidates=[
            ['USI:HIGN','USI:LOWN'],
            ['INDEX:HIGN','INDEX:LOWN'],
            ['USI:HIGN','USI:LOWN','INDEX:HIGN','INDEX:LOWN'],
          ]
          for tickers in candidates:
              payload={
                'symbols':{'tickers':tickers},
                'columns':['name','description','close','exchange','type','update_mode'],
                'range':[0,20],
                'options':{'lang':'en'},
              }
              try:
                  r=requests.post(url,json=payload,headers=headers,timeout=30)
                  print('TICKERS', tickers, 'STATUS', r.status_code)
                  print(r.text[:5000])
              except Exception as e:
                  print('ERROR', tickers, repr(e))
          PY
