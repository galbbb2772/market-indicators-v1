name: News Market Confirmation Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/news_market_confirm_smoke.yml
      - news_signal.py
      - news_signal_v2.py
      - market_reaction.py
      - news_sources.json
      - news_keywords.json

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run confirmed News Signal
        run: python news_signal_v2.py
