name: Market Top NG3 First-Release NSA Panel 1986-1988

on:
  pull_request:
    paths:
      - "research/build_market_top_ng3_first_release_panel_1986_1988.py"
      - "research/build_market_top_ng3_first_release_nsa_panel_1986_1988.py"
      - "research/MARKET_TOP_NG3_PPI_REVISION_SEMANTICS.md"
      - "research/MARKET_TOP_NG3_FIRST_RELEASE_NSA_PANEL_1986_1988.md"
      - "tests/test_market_top_ng3_first_release_nsa_panel.py"
      - ".github/workflows/market_top_ng3_first_release_nsa_panel_1986_1988.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pypdf

      - name: Run Table 1 parser contract tests
        run: python -m unittest tests.test_market_top_ng3_first_release_nsa_panel -v

      - name: Build first-release NSA panel
        run: |
          python research/build_market_top_ng3_first_release_nsa_panel_1986_1988.py \
            --output market_top_ng3_first_release_nsa_panel_1986_1988.json

      - uses: actions/upload-artifact@v4
        with:
          name: market-top-ng3-first-release-nsa-panel-1986-1988
          path: market_top_ng3_first_release_nsa_panel_1986_1988.json
          if-no-files-found: error
