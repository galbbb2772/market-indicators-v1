name: Daily Market Indicators

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_data.py
      - history_builder.py
      - patch_divergence_ui.py
      - indicator_config.json
      - market_model_v2.json
      - manual_inputs.json
      - requirements.txt
      - docs/index.html
      - .github/workflows/daily_update.yml
  schedule:
    - cron: '30 22 * * *'
      timezone: 'America/New_York'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-indicators
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh all indicators
        run: python update_data.py

      - name: Build three-index history
        run: python history_builder.py

      - name: Patch divergence dashboard
        run: python patch_divergence_ui.py

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/current.json docs/index.html
          if git diff --cached --quiet; then
            echo "No dashboard changes"
          else
            git commit -m "chore: refresh indicators and divergence dashboard"
            git pull --rebase origin main
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
