name: Daily Market Indicators
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_data.py
      - ablation_runner.py
      - run_ablation_resilient.py
      - history_builder.py
      - build_structure_lab.py
      - macro_sources.py
      - macro_integrity.py
      - official_indpro.py
      - structure_resilient.py
      - cycle_research.py
      - structure_core.py
      - patch_structure_nav.py
      - patch_structure_cycle_nav.py
      - patch_research_hub_nav.py
      - patch_research_terminal_v2.py
      - patch_divergence_ui.py
      - patch_divergence_v2.py
      - patch_divergence_v2_fix.py
      - patch_box_age.py
      - patch_narrative_layer.py
      - patch_sec_fundamentals.py
      - yahoo_fundamentals.py
      - patch_treasury_stress.py
      - patch_news_ui.py
      - patch_news_ui_v2.py
      - patch_news_signal.py
      - news_signal.py
      - news_signal_v2.py
      - market_reaction.py
      - news_sources.json
      - news_keywords.json
      - indicator_config.json
      - market_model_v2.json
      - manual_inputs.json
      - requirements.txt
      - docs/index.html
      - docs/structure-lab.html
      - docs/cycle-lab.html
      - docs/research-hub.html
      - docs/research-terminal-v2.css
      - docs/research-terminal-v2.js
      - tests/test_research_hub.py
      - tests/test_research_terminal_v2.py
      - tests/test_structure_core.py
      - tests/test_macro_sources.py
      - tests/test_official_indpro.py
      - tests/test_cycle_research.py
      - .github/workflows/daily_update.yml
  schedule:
    - cron: '30 22 * * *'
      timezone: 'America/New_York'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-indicators
  cancel-in-progress: true
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify causal structure and official source adapters
        run: python -m unittest discover -s tests -v
      - name: Refresh indicators and run ablation
        run: python run_ablation_resilient.py
      - name: Build three-index history
        run: python history_builder.py
      - name: Patch divergence interval and analog model
        run: python patch_divergence_v2.py
      - name: Apply analog current-level fix
        run: python patch_divergence_v2_fix.py
      - name: Add formed age for range boxes
        run: python patch_box_age.py
      - name: Build Mega-cap Fundamentals V1
        run: python patch_sec_fundamentals.py
      - name: Build Treasury short-term stress context
        run: python patch_treasury_stress.py
      - name: Build Narrative Layer V1
        run: python patch_narrative_layer.py
      - name: Install News Signal dashboard UI
        run: python patch_news_ui.py
      - name: Install News market-confirmation UI
        run: python patch_news_ui_v2.py
      - name: Build News Signal V1.4
        run: python patch_news_signal.py
      - name: Build new research ONLY after vendor rights AND explicit owner website approval
        if: vars.STRUCTURE_PUBLIC_DATA_LICENSES_APPROVED == 'true' && vars.STRUCTURE_DEPLOY_AUTHORIZED == 'true'
        env:
          STRUCTURE_PUBLIC_DATA_LICENSES_APPROVED: 'true'
          STRUCTURE_DEPLOY_AUTHORIZED: 'true'
        run: python structure_resilient.py
        continue-on-error: true
      - name: Link and style approved structure, cycle and research hub pages
        if: vars.STRUCTURE_PUBLIC_DATA_LICENSES_APPROVED == 'true' && vars.STRUCTURE_DEPLOY_AUTHORIZED == 'true'
        run: |
          python patch_structure_nav.py
          python patch_structure_cycle_nav.py
          python patch_research_hub_nav.py
          python patch_research_terminal_v2.py
      - name: Commit refreshed dashboard, retaining approval gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/current.json docs/data/news_history.json docs/data/fundamental_history.json docs/index.html
          if test "${{ vars.STRUCTURE_PUBLIC_DATA_LICENSES_APPROVED }}" = 'true' && test "${{ vars.STRUCTURE_DEPLOY_AUTHORIZED }}" = 'true'; then
            if test -f docs/data/structure_lab.json; then git add docs/data/structure_lab.json; fi
            git add docs/structure-lab.html docs/cycle-lab.html docs/research-hub.html docs/research-terminal-v2.css docs/research-terminal-v2.js
          fi
          if git diff --cached --quiet; then
            echo "No dashboard changes"
          else
            git commit -m "chore: refresh indicators and explicitly authorized research"
            git pull --rebase origin main
            git push
          fi
      - name: Exclude unapproved research pages and terminal assets from GitHub Pages artifact
        if: vars.STRUCTURE_PUBLIC_DATA_LICENSES_APPROVED != 'true' || vars.STRUCTURE_DEPLOY_AUTHORIZED != 'true'
        run: |
          rm -f docs/structure-lab.html docs/cycle-lab.html docs/research-hub.html docs/research-terminal-v2.css docs/research-terminal-v2.js docs/data/structure_lab.json
          echo "Research page deployment disabled; existing approved dashboard preserved."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
