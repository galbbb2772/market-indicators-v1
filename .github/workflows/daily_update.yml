name: Daily Market Indicators

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_data.py
      - ablation_runner.py
      - history_builder.py
      - patch_divergence_ui.py
      - patch_divergence_v2.py
      - patch_divergence_v2_fix.py
      - patch_box_age.py
      - patch_narrative_layer.py
      - patch_sec_fundamentals.py
      - yahoo_fundamentals.py
      - patch_treasury_stress.py
      - patch_news_ui.py
      - patch_news_ui_v2.py
      - patch_news_signal.py
      - news_signal.py
      - news_signal_v2.py
      - market_reaction.py
      - news_sources.json
      - news_keywords.json
      - indicator_config.json
      - market_model_v2.json
      - manual_inputs.json
      - requirements.txt
      - docs/index.html
      - .github/workflows/daily_update.yml
  schedule:
    - cron: '30 22 * * *'
      timezone: 'America/New_York'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-indicators
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh indicators and run ablation
        run: python ablation_runner.py

      - name: Build three-index history
        run: python history_builder.py

      - name: Patch divergence interval and analog model
        run: python patch_divergence_v2.py

      - name: Apply analog current-level fix
        run: python patch_divergence_v2_fix.py

      - name: Add formed age for range boxes
        run: python patch_box_age.py

      - name: Build Mega-cap Fundamentals V1
        run: python patch_sec_fundamentals.py

      - name: Build Treasury short-term stress context
        run: python patch_treasury_stress.py

      - name: Build Narrative Layer V1
        run: python patch_narrative_layer.py

      - name: Install News Signal dashboard UI
        run: python patch_news_ui.py

      - name: Install News market-confirmation UI
        run: python patch_news_ui_v2.py

      - name: Build News Signal V1.4
        run: python patch_news_signal.py

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/current.json docs/data/news_history.json docs/data/fundamental_history.json docs/index.html
          if git diff --cached --quiet; then
            echo "No dashboard changes"
          else
            git commit -m "chore: refresh indicators, fundamentals, Treasury stress, narratives, news and dashboard"
            git pull --rebase origin main
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
