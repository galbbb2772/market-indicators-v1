name: Market Top Inflation-Margin V1.1 Screen

on:
  pull_request:
    paths:
      - "research/MARKET_TOP_INFLATION_MARGIN_V1_PREREGISTRATION.md"
      - "research/market_top_inflation_margin_v1_preregistration.json"
      - "screen_inflation_margin_v1.py"
      - "tests/test_inflation_margin_v1_preregistration.py"
      - ".github/workflows/market_top_inflation_margin_v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Verify frozen preregistration
        run: python -m unittest tests.test_inflation_margin_v1_preregistration -v

      - name: Run historical screening
        run: |
          python screen_inflation_margin_v1.py \
            --output market_top_inflation_margin_v1_result.json

      - name: Print screening summary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("market_top_inflation_margin_v1_result.json"))
          print("decision =", x["decision"])
          print("metrics =", json.dumps(x["decision_metrics"], indent=2))
          print("positive =", json.dumps(x["validation_positive_window_hits"], indent=2))
          print("negative =", json.dumps(x["validation_negative_window_hits"], indent=2))
          print("episodes =")
          for ep in x["episodes"]:
              print(
                  ep["start"],
                  ep["end"],
                  "training=", ep["training_overlap"],
                  "route=", round(ep["route_at_start"], 4),
                  "class=", ep["outcome_252"].get("classification"),
                  "worst=", ep["outcome_252"].get("worst_return_from_anchor_pct"),
              )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: market-top-inflation-margin-v1-result
          path: market_top_inflation_margin_v1_result.json
          if-no-files-found: error
