name: Validate Structure Source Bootstrap
on:
  pull_request:
    branches: [main]
    paths:
      - structure_core.py
      - build_structure_lab.py
      - macro_sources.py
      - macro_integrity.py
      - structure_resilient.py
      - cycle_research.py
      - docs/cycle-lab.html
      - patch_structure_cycle_nav.py
      - tests/test_structure_core.py
      - tests/test_macro_sources.py
      - tests/test_cycle_research.py
      - .github/workflows/validate_structure_sources.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate direct providers, causal clock, and strict source-safe caching
        run: python -m unittest discover -s tests -v
      - name: Verify research page navigation patch is idempotent
        run: |
          python patch_structure_cycle_nav.py
          python patch_structure_cycle_nav.py
          grep -q '周期性与预测能力图表' docs/structure-lab.html
      - name: Dry-run REAL source and print AGGREGATED descriptive research numbers only
        run: |
          python - <<'PY'
          import build_structure_lab as lab
          import structure_resilient as resilient
          lab.SYMBOLS={k:lab.SYMBOLS[k] for k in ('SPY','XLK','^GSPC')}
          out=resilient.assemble(prices=True,optional_fred=False)
          assert 'SPY' in out['instruments'],out['errors']
          assert len(out['instruments']['SPY']['bars'])>=200
          assert len(out['instruments']['SPY']['boxes'])>0
          assert 'XLK' in out['instruments'],out['errors']
          for k,source in [('T10Y3M','US_TREASURY_DIRECT'),('UNRATE','US_BLS_DIRECT')]:
              assert k in out['macro'],out['errors']
              a=out['macro'][k]
              assert a['source']==source and len(a['observations'])>=12,out['errors']
              print('MACRO',k,source,a['start'],a['end'],'n',len(a['observations']),
                    'status',a['status'],'missing_history_months',a['missing_month_count'])
          c=out['cycle_research']
          assert c['status']=='research_only',out['errors']
          assert c['directional']['5']['n']>0
          assert 'XLK' in c['sectors']
          for horizon in ('5','20'):
              a=c['directional'][horizon]
              print('WALKFORWARD',horizon,'n',a['n'],'model_brier',a['brier_model'],
                    'prior_only_baseline_brier',a['brier_base'],
                    'difference',a['brier_difference'],'skill',a['brier_skill'])
          s=c['sectors']['XLK']
          print('XLK RELATIVE AUTOCORRELATION',s['weeks'],s['lags'])
          print('VERIFIED PRICE SPY sessions',len(out['instruments']['SPY']['bars']))
          print('RESEARCH ONLY; observations are revised vendor history. NO files written or publicly deployed.')
          PY
