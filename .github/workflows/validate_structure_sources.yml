name: Validate Structure Source Bootstrap
on:
  pull_request:
    branches: [main]
    paths:
      - structure_core.py
      - build_structure_lab.py
      - macro_sources.py
      - structure_resilient.py
      - cycle_research.py
      - docs/cycle-lab.html
      - patch_structure_cycle_nav.py
      - tests/test_structure_core.py
      - tests/test_macro_sources.py
      - tests/test_cycle_research.py
      - .github/workflows/validate_structure_sources.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate source adapters, online boxes, and predictive causality tests
        run: python -m unittest discover -s tests -v
      - name: Verify research page link insertion is idempotent
        run: |
          python patch_structure_cycle_nav.py
          python patch_structure_cycle_nav.py
          grep -q '周期性与预测能力图表' docs/structure-lab.html
      - name: Live data dry run without distributing raw data
        run: |
          python - <<'PY'
          import build_structure_lab as lab
          import structure_resilient as resilient
          lab.SYMBOLS={k:lab.SYMBOLS[k] for k in ('SPY','XLK','^GSPC')}
          out=resilient.assemble(prices=True,optional_fred=False)
          assert 'SPY' in out['instruments'],out['errors']
          assert len(out['instruments']['SPY']['bars'])>=200
          assert len(out['instruments']['SPY']['boxes'])>0
          assert 'XLK' in out['instruments'],out['errors']
          for k in ('T10Y3M','UNRATE'):
              assert k in out['macro'],out['errors']
              assert len(out['macro'][k]['observations'])>=12,out['errors']
              print('VERIFIED',k,out['macro'][k]['source'],
                    out['macro'][k]['start'],out['macro'][k]['end'],
                    'n',len(out['macro'][k]['observations']),
                    'coverage',out['macro'][k]['completeness'])
          assert out['cycle_research']['status']=='research_only',out['errors']
          assert out['cycle_research']['directional']['5']['n']>0
          assert 'XLK' in out['cycle_research']['sectors']
          print('CYCLE REPORT VERIFIED:',
                out['cycle_research']['directional']['5']['status'],
                'n',out['cycle_research']['directional']['5']['n'])
          print('VERIFIED PRICE SPY:',len(out['instruments']['SPY']['bars']),'bars')
          print('RESEARCH ONLY: no data written, no public deployment.')
          PY
