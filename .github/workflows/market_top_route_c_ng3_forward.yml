name: Market Top Route_C NG3 Forward

on:
  pull_request:
    paths:
      - "research/MARKET_TOP_ROUTE_C_NG3_PREREGISTRATION.md"
      - "research/market_top_route_c_ng3_preregistration.json"
      - "research/MARKET_TOP_ROUTE_C_NG3_EVIDENCE_PROTOCOL.md"
      - "research/market_top_route_c_ng3_evidence_protocol.json"
      - "market_top_route_c_ng3_forward.py"
      - "tests/test_route_c_ng3_preregistration.py"
      - ".github/workflows/market_top_route_c_ng3_forward.yml"
  workflow_dispatch:
  schedule:
    - cron: "37 13 * * 1-5"

permissions:
  contents: read

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests openpyxl

      - name: Verify frozen NG3 contract
        run: python -m unittest tests.test_route_c_ng3_preregistration -v

      - name: Run research forward dry-run
        run: python market_top_route_c_ng3_forward.py --dry-run
