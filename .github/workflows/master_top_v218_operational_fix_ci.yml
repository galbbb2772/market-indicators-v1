name: V2.1.8 fail-closed operations patch CI
on:
  push:
    branches:
      - fix/master-top-v218-fail-closed-freshness-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pandas numpy requests pytest
      - name: Validate frozen implementation and source gate
        run: |
          python -m py_compile master_top_v218.py
          pytest -q tests/test_master_top_v218.py tests/test_master_top_v218_operations.py
