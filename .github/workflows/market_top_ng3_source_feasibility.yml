name: Market Top NG3 Source Feasibility

on:
  pull_request:
    paths:
      - "audit_market_top_ng3_source_feasibility.py"
      - "research/MARKET_TOP_NG3_SOURCE_FEASIBILITY.md"
      - ".github/workflows/market_top_ng3_source_feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run BLS coverage audit
        run: |
          python audit_market_top_ng3_source_feasibility.py \
            --output market_top_ng3_source_feasibility.json

      - name: Print compact result
        run: |
          python - <<'PY'
          import json
          x=json.load(open("market_top_ng3_source_feasibility.json"))
          for k,v in x["bls"].items():
              print(k, v["series_id"], v["first"], v["last"], len(v["missing_months"] or []))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: market-top-ng3-source-feasibility
          path: market_top_ng3_source_feasibility.json
          if-no-files-found: error
