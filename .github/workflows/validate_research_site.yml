name: Validate Research Hub Preview
on:
  pull_request:
    branches: [main]
    paths:
      - docs/research-hub.html
      - patch_research_hub_nav.py
      - tests/test_research_hub.py
      - .github/workflows/validate_research_site.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate real-archive-only six-module site
        run: python -m unittest discover -s tests -p 'test_research_hub.py' -v
      - name: Verify nav patch idempotence and deep links in disposable Actions checkout
        run: |
          python -m py_compile patch_research_hub_nav.py
          python patch_research_hub_nav.py
          python patch_research_hub_nav.py
          grep -q 'research-hub-nav: approved deployment only' docs/index.html
          grep -q 'research-hub-deeplink' docs/structure-lab.html
          grep -q 'research-hub.html' docs/cycle-lab.html
      - name: JavaScript syntax check for new hub and tab router
        run: |
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          for name in ('research-hub.html','structure-lab.html'):
              html=Path('docs',name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
              scripts=[x for x in scripts if x.strip()]
              # Only verify the new hub JS / new appended router. Original
              # third-party dashboard JS is validated in its own CI.
              if name=='structure-lab.html':
                  scripts=[scripts[-1]]
              assert scripts, f'{name}: no new JS found'
              for script in scripts:
                  subprocess.run(['node','--check','-'],input=script,text=True,check=True)
              print('JavaScript syntax OK',name,flush=True)
          PY
      - name: Package real archived site files, not unlicensed vendor OHLCV
        run: |
          mkdir -p preview/data
          cp docs/research-hub.html docs/structure-lab.html docs/cycle-lab.html docs/index.html preview/
          cp docs/data/news_history.json docs/data/current.json docs/data/fundamental_history.json preview/data/
          cat > preview/README.txt <<'TXT'
          This is a NON-DEPLOYED research website preview.
          Contains already-present public Market V2 files and genuine archived news data.
          No unlicensed structure_lab.json or private trading data is included.
          From a computer with Python 3: python -m http.server 8000 --directory preview
          Then open http://localhost:8000/research-hub.html in your browser.
          Historical stock/ETF box graphs still require source-rights review and
          explicit website deployment permission; no backtests are being run.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: research-hub-preview
          path: preview/
          retention-days: 7
