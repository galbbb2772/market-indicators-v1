name: Full Indicator History Validation V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - research_indicator_validation_v1.py
      - research_indicator_validation_v1_sourceaware.py
      - research/indicator_validation_v1/STUDY_SPEC.md
      - ablation_runner.py
      - update_data.py
      - indicator_config.json
      - market_model_v2.json
      - manual_inputs.json
      - requirements.txt
      - .github/workflows/indicator_validation_v1.yml

permissions:
  contents: write

concurrency:
  group: indicator-validation-v1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full indicator validation
        run: python research_indicator_validation_v1_sourceaware.py

      - name: Build validation summary in same job
        run: python summarize_indicator_validation_v1.py
      - name: Validate research output
        run: |
          python - <<'PY'
          import json
          p='docs/data/indicator_validation_v1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['schema']=='INDICATOR-VALIDATION-V1'
          assert d['research_only'] is True and d['diagnostic_only'] is True
          assert d['production_effect']=='none'
          assert d['weights_changed'] is False and d['thresholds_changed'] is False
          assert d['decision']['may_change_market_model_v2'] is False
          assert d['decision']['historical_best_selection_allowed'] is False
          assert d['coverage']['eligible_indicator_count'] >= 20
          assert len(d['indicators']) == d['coverage']['eligible_indicator_count']
          assert 'source_run' in d and 'source_strata' in d
          assert d['source_strata']['formula_invariant_market_price_or_derived']['n'] >= 20
          for x in d['indicators']:
              assert set(x['horizons'])=={'1d','5d','10d','20d','60d'}
              assert x['aligned_observations'] >= d['eligibility']['minimum_aligned_observations']
          print('INDICATOR_VALIDATION_V1_VALID', {
              'eligible':d['coverage']['eligible_indicator_count'],
              'roles':d['summary']['role_counts'],
              'stable':d['summary']['primary_phase_same_sign_ge70_count'],
              'redundancy_pairs':d['summary']['redundancy_pairs_abs_rho_ge085'],
              'fred_error_count':d['source_run']['fred_error_count'],
              'source_strata':d['source_strata'],
          })
          PY

      - name: Commit research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+galbbb2772@users.noreply.github.com"
          git restore docs/data/current.json
          git add docs/data/indicator_validation_v1.json docs/data/indicator_validation_v1_summary.json
          if git diff --cached --quiet; then
            echo "No indicator-validation data change."
          else
            git commit -m "data: refresh full indicator validation V1"
            git pull --rebase origin main
            git push
          fi
