name: Indicator Validation V1 Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/indicator_validation_v2.yml

permissions:
  contents: read

concurrency:
  group: indicator-validation-v1
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preserve comprehensive V1
        run: |
          python - <<'PY'
          import json
          p='docs/data/indicator_validation_v1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['schema']=='INDICATOR-VALIDATION-V1'
          assert d['coverage']['eligible_indicator_count']>=60
          rows=d.get('indicators') or d.get('results') or []
          assert len(rows)>=60
          assert any('horizons' in x for x in rows)
          print('COMPREHENSIVE_INDICATOR_VALIDATION_V1_PRESERVED', d['coverage'])
          PY
