name: Market Top Route_C NG2 Forward

on:
  pull_request:
    paths:
      - "market_top_route_c_ng2_forward.py"
      - "tests/test_market_top_route_c_ng2_forward.py"
      - "tests/test_market_top_route_c_ng2_preregistration.py"
      - "tests/test_market_top_route_c_ng2_data.py"
      - "docs/data/market_top_route_c_ng2_current.json"
      - "docs/data/market_top_route_c_ng2_history.json"
      - "research/MARKET_TOP_ROUTE_C_NG_DECISION_RECORD.md"
      - "research/MARKET_TOP_ROUTE_C_NG2_PREREGISTRATION.md"
      - "research/market_top_route_c_ng2_preregistration.json"
      - ".github/workflows/market_top_route_c_ng2_forward.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 4 5 * *"

permissions:
  contents: write

concurrency:
  group: market-top-route-c-ng2-forward
  cancel-in-progress: false

jobs:
  validate-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile market_top_route_c_ng2_forward.py

      - name: Static and forward contracts
        run: |
          python -m unittest \
            tests.test_market_top_route_c_ng2_preregistration \
            tests.test_market_top_route_c_ng2_forward \
            tests.test_market_top_route_c_ng2_data \
            -v

      - name: Live dry-run on pull request
        if: github.event_name == 'pull_request'
        run: python market_top_route_c_ng2_forward.py --dry-run

      - name: Refresh monthly NG2 monitor
        if: github.event_name != 'pull_request'
        run: python market_top_route_c_ng2_forward.py

      - name: Validate governance
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          x=json.load(open("docs/data/market_top_route_c_ng2_current.json"))
          assert x["research_only"] is True
          assert x["production_effect"] == "none"
          assert x["validation_status"] == "PROSPECTIVE_VALIDATION_PENDING"
          assert x["governance"]["historical_validation_authorized"] is False
          assert x["governance"]["production_promotion_authorized"] is False
          assert x["governance"]["post_preregistration_tuning_allowed"] is False
          assert x["prospective_start_effective_month"] == "202701"
          if x["counts_toward_prospective_validation"]:
              assert x["effective_month"] >= "202701"
              assert x["source_temporality"]["all_source_months_fully_post_preregistration"] is True
          PY

      - name: Commit research monitor
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/market_top_route_c_ng2_current.json docs/data/market_top_route_c_ng2_history.json
          if git diff --cached --quiet; then
            echo "No Route_C NG2 monitor change."
          else
            git commit -m "data: refresh Route_C NG2 prospective monitor"
            git push
          fi
