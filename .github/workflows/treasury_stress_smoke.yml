name: Treasury Stress Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/treasury_stress_smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Run Treasury stress calculation
        run: python patch_treasury_stress.py
