name: Market Top Route_A NG1 Independent Source Audit

on:
  pull_request:
    paths:
      - "audit_market_top_ng1_a_independent.py"
      - "tests/test_audit_market_top_ng1_a_independent.py"
      - "research/MARKET_TOP_NG1_AC_PREREGISTRATION.md"
      - "research/market_top_ng1_ac_preregistration.json"
      - ".github/workflows/market_top_ng1_a_independent_audit.yml"
  workflow_dispatch:

jobs:
  route-a-ng1-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas requests
      - name: Static contracts
        run: python -m unittest tests.test_audit_market_top_ng1_a_independent -v
      - name: Independent 2007-11 live-source replay
        run: |
          python audit_market_top_ng1_a_independent.py --output /tmp/ng1_a.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/ng1_a.json"))
          assert x["formula_version"] == "Route_A_NG1"
          assert x["effective_month"] == "2007-11"
          assert x["source_months"]["fama_french"] == "200709"
          assert x["source_months"]["credit_spread"] == "200710"
          assert x["status"] == "PASS"
          assert x["scores"]["route_a_ng1"] >= 85
          assert x["top_location"]["passes"] is True
          print(
              "ROUTE_A_NG1_INDEPENDENT",
              "score=", x["scores"]["route_a_ng1"],
              "margin=", x["scores"]["margin"],
              "gate=", x["top_location"]["passes"],
          )
          PY
