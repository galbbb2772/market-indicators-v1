name: MASTER TOP V2.1.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'master_top_v218.py'
      - 'MASTER_TOP_V2_1_8_SPEC.md'
      - '.github/workflows/master_top_v218.yml'
  schedule:
    - cron: '35 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: master-top-v218
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install pandas numpy requests pyarrow pytest tradingview-screener
      - name: Unit tests
        run: pytest -q tests/test_master_top_v218.py
      - name: Score frozen V2.1.8
        env:
          MARKETPARQUET_API_KEY: ${{ secrets.MARKETPARQUET_API_KEY }}
          MASTER_TOP_BASELINE_TRIGGER: ${{ vars.MASTER_TOP_BASELINE_TRIGGER }}
        run: python master_top_v218.py
      - name: Commit refreshed score
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/master_top_v218.json
          if [ -f docs/data/master_top_v218_breadth_tail.csv ]; then git add docs/data/master_top_v218_breadth_tail.csv; fi
          if [ -f docs/data/master_top_v218_hilo_ledger.csv ]; then git add docs/data/master_top_v218_hilo_ledger.csv; fi
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'data: refresh MASTER TOP V2.1.8'
            git push
          fi
