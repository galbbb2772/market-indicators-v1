name: Market Top NG3 First-Release Inventory 1986-1988

on:
  pull_request:
    paths:
      - "research/build_market_top_ng3_first_release_inventory_1986_1988.py"
      - "research/market_top_ng3_first_release_inventory_1986_1988.json"
      - "research/MARKET_TOP_NG3_FIRST_RELEASE_INVENTORY_1986_1988.md"
      - ".github/workflows/market_top_ng3_first_release_inventory_1986_1988.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pypdf
      - name: Build bounded archive inventory
        run: |
          python research/build_market_top_ng3_first_release_inventory_1986_1988.py \
            --output market_top_ng3_first_release_inventory_1986_1988.json
      - uses: actions/upload-artifact@v4
        with:
          name: market-top-ng3-first-release-inventory-1986-1988
          path: market_top_ng3_first_release_inventory_1986_1988.json
          if-no-files-found: error
