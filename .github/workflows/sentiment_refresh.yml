name: Sentiment History Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sentiment_history.py
      - patch_sentiment_tab.py
      - patch_sentiment_series_filter.py
      - patch_sentiment_panzoom.py
      - docs/sentiment.html
      - .github/workflows/sentiment_refresh.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sentiment-history-refresh
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build sentiment and euphoria history
        run: python sentiment_history.py

      - name: Install sentiment dashboard navigation
        run: python patch_sentiment_tab.py

      - name: Install sentiment chart series filters
        run: python patch_sentiment_series_filter.py

      - name: Install bounded sentiment chart pan and zoom
        run: python patch_sentiment_panzoom.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
