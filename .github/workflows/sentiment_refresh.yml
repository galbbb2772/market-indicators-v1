name: Sentiment History Refresh

# bounded pan/zoom deploy path
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sentiment_history.py
      - patch_sentiment_tab.py
      - patch_sentiment_series_filter.py
      - patch_sentiment_panzoom.py
      - patch_sentiment_index_return.py
      - patch_sentiment_divergence_panzoom.py
      - patch_sentiment_performance.py
      - patch_sentiment_syntax_repair.py
      - docs/sentiment.html
      - .github/workflows/sentiment_refresh.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sentiment-history-refresh
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build sentiment and euphoria history
        run: python sentiment_history.py

      - name: Install sentiment dashboard navigation
        run: python patch_sentiment_tab.py

      - name: Install sentiment chart series filters
        run: python patch_sentiment_series_filter.py

      - name: Install bounded sentiment chart pan and zoom
        run: python patch_sentiment_panzoom.py

      - name: Install synchronized index return chart
        run: python patch_sentiment_index_return.py

      - name: Install bounded divergence chart pan and zoom
        run: python patch_sentiment_divergence_panzoom.py

      - name: Optimize sentiment chart rendering
        run: python patch_sentiment_performance.py

      - name: Repair sentiment startup syntax/cache
        run: python patch_sentiment_syntax_repair.py

      - name: Validate sentiment JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('docs/sentiment.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not blocks:
              raise SystemExit('no inline script found')
          Path('/tmp/sentiment.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/sentiment.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
