name: Market Top Shadow Forward

on:
  pull_request:
    paths:
      - "update_market_top_shadow.py"
      - "policyshock_v211.py"
      - "market_top_canonical_inputs.py"
      - "t_v24r.py"
      - "tests/test_update_market_top_shadow.py"
      - ".github/workflows/market_top_shadow_forward.yml"
  workflow_dispatch:
  schedule:
    # After the U.S. close, Tuesday-Saturday UTC. Scheduled workflows run
    # from the default branch after this research workflow is merged.
    - cron: "30 1 * * 2-6"

permissions:
  contents: write

concurrency:
  group: market-top-shadow-forward
  cancel-in-progress: false

jobs:
  validate-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile forward shadow updater
        run: python -m py_compile update_market_top_shadow.py

      - name: Run forward shadow unit contracts
        run: python -m unittest tests.test_update_market_top_shadow -v

      - name: Live source dry-run on pull request
        if: github.event_name == 'pull_request'
        run: python update_market_top_shadow.py --dry-run

      - name: Refresh forward shadow outputs
        if: github.event_name != 'pull_request'
        run: python update_market_top_shadow.py

      - name: Validate generated snapshot
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("docs/data/market_top_shadow_current.json")
          x = json.loads(p.read_text())

          assert x["research_only"] is True
          assert x["production_effect"] == "none"
          assert x["full_legacy_model"]["pressure_authoritative"] is False
          assert x["full_legacy_model"]["route_a"] == "UNRESOLVED"
          assert x["full_legacy_model"]["route_c"] == "UNRESOLVED"
          assert 0 <= x["route_b"]["score"] <= 100
          assert 0 <= x["price_confirmation"]["t_v24r"] <= 100
          print(
              "MARKET TOP SHADOW",
              x["asof"],
              "Route_B=", round(x["route_b"]["score"], 2),
              "T=", round(x["price_confirmation"]["t_v24r"], 2),
              "state=", x["policy_path"]["state"],
          )
          PY

      - name: Commit research shadow snapshot
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/data/market_top_shadow_current.json docs/data/market_top_shadow_history.json)" ]; then
            git add docs/data/market_top_shadow_current.json docs/data/market_top_shadow_history.json
            git commit -m "data: refresh Market Top shadow forward"
            git push
          else
            echo "No Market Top shadow data change."
          fi
