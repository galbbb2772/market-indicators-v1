name: Fundamentals Source Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sec_fundamentals_smoke.yml
      - sec_fundamentals.py

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe Yahoo fundamentals timeseries
        run: |
          python - <<'PY'
          import time, requests
          now=int(time.time())
          url='https://query2.finance.yahoo.com/ws/fundamentals-timeseries/v1/finance/timeseries/AAPL'
          params={
            'symbol':'AAPL',
            'type':'quarterlyTotalRevenue,quarterlyNetIncome,annualOperatingCashFlow,annualCapitalExpenditure,quarterlyCashCashEquivalentsAndShortTermInvestments,quarterlyTotalAssets,quarterlyTotalDebt',
            'period1':now-60*60*24*365*5,
            'period2':now,
          }
          r=requests.get(url,params=params,headers={'User-Agent':'Mozilla/5.0'},timeout=20)
          print('status',r.status_code)
          print(r.text[:5000])
          r.raise_for_status()
          PY
