name: SEC Fundamentals Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sec_fundamentals_smoke.yml
      - sec_fundamentals.py

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run SEC fundamentals
        run: python sec_fundamentals.py
